services:
  mc-discord-bot:
    build:
      context: .
      dockerfile: dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QUEST_API_PORT:-8765}:8765"
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CHANNEL_ID=${CHANNEL_ID:-}
      - MINECRAFT_IP=${MINECRAFT_IP:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COMMAND_PREFIX=${COMMAND_PREFIX:-!}
      - TOGGLE_ROLE_ID=${TOGGLE_ROLE_ID:-0}
      - DATABASE_PATH=/app/data/bot.sqlite3
      - MOTHERS_LEDGER_SECRET=${MOTHERS_LEDGER_SECRET:-}
      - QUEST_API_HOST=0.0.0.0
      - QUEST_API_PORT=8765
    volumes:
      - bot_data:/app/data

volumes:
  bot_data: {}
